[project]
name = "delivery-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rodrigo Perna", email = "rodrigo.perna@photonicsens.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
]

[project.scripts]
delivery-dashboard = "delivery_dashboard:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
